version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerai
      POSTGRES_PASSWORD: careerai
      POSTGRES_DB: careerai
    ports:
      - "5432:5432"
    volumes:
      - careerai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  careerai_pgdata:
